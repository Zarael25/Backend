trigger:
- develop

pool:
  vmImage: ubuntu-latest

variables:
- group: azure_fichas

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0   # Trae todo el historial y todas las ramas

# Instalar dependencias
- script: |
    echo "Instalando dependencias..."
    python -m venv .venv
    source .venv/bin/activate
    pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Instalar dependencias'

# Ejecutar pruebas
- script: |
    echo "Ejecutando pruebas con pytest..."
    source .venv/bin/activate
    pytest -v
  displayName: 'Ejecutar pruebas'


# Solo si las pruebas pasan, hacemos push a GitHub
- script: |
    echo "Configurando GitHub remoto..."
    git remote remove origin-gh || true
    git remote add origin-gh https://Zarael25:$(GITHUB_TOKEN)@github.com/Zarael25/Backend.git
    echo "Cambiando a branch develop"
    git checkout develop
    echo "Haciendo push a GitHub..."
    git push origin-gh develop
  displayName: 'Push Azure develop to GitHub'