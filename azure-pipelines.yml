trigger:
- develop   # Se ejecuta el pipeline cuando hay cambios en la rama develop

pool:
  vmImage: 'ubuntu-latest'  # Agente de build: Ubuntu

variables:
- group: azure_fichas  # Grupo de variables definidas en Azure DevOps (contiene las credenciales y URLs)

steps:
# ---------------- Checkout del repositorio ----------------
- checkout: self
  persistCredentials: true     # Mantiene credenciales configuradas en el agente
  fetchDepth: 0                # Clona todo el historial de commits y ramas (no solo el último)

# ---------------- Configurar versión de Python ----------------
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'        # Se usará Python 3.11
    addToPath: true

# ---------------- Instalar dependencias y ejecutar tests ----------------
- script: |
    echo "Creando virtualenv..."
    python -m venv .venv
    source .venv/bin/activate

    echo "Actualizando pip..."
    pip install --upgrade pip

    echo "Instalando dependencias..."
    pip install -r requirements.txt

    echo "Verificando variables de entorno..."
    echo "DATABASE_URL: $DATABASE_URL"
    echo "DATABASE_URL_ADMIN: $DATABASE_URL_ADMIN"
    echo "DATABASE_URL_PUBLICO: $DATABASE_URL_PUBLICO"
    echo "DATABASE_URL_LECTURA: $DATABASE_URL_LECTURA"

    echo "Ejecutando tests con pytest..."
    pytest --ds=fichas_backend.settings --disable-warnings -v
  displayName: 'Instalar dependencias y ejecutar tests'
  env:
    DATABASE_URL: $(DATABASE_URL)                # Variables secretas de conexión
    DATABASE_URL_ADMIN: $(DATABASE_URL_ADMIN)
    DATABASE_URL_PUBLICO: $(DATABASE_URL_PUBLICO)
    DATABASE_URL_LECTURA: $(DATABASE_URL_LECTURA)
    DJANGO_SETTINGS_MODULE: fichas_backend.settings

# ---------------- Push a GitHub si los tests pasan ----------------
- script: |
    echo "Configurando GitHub remoto..."
    git remote remove origin-gh || true
    git remote add origin-gh https://Zarael25:$(GITHUB_TOKEN)@github.com/Zarael25/Backend.git

    echo "Asegurando que la rama develop exista localmente..."
    git fetch origin develop:refs/heads/develop
    git checkout develop || git checkout -b develop

    echo "Haciendo push a GitHub..."
    git push origin-gh HEAD:develop
  displayName: 'Push Azure develop to GitHub'
