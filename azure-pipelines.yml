trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.10'

  - script: python -m pip install --upgrade pip
    displayName: 'Upgrade pip'

  - script: pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: python manage.py migrate
    displayName: 'Run migrations'

  - script: python manage.py collectstatic --noinput
    displayName: 'Collect static files'

  - script: |
      curl -X POST https://api.render.com/deploy/srv-xxxxxxxxxx?key=RENDER_API_KEY
    displayName: 'Trigger Render Deploy'