trigger:
- develop

pool:
  vmImage: ubuntu-latest

variables:
- group: azure_fichas   # aquí puedes agregar DATABASE_URL si quieres

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

# Instalar dependencias y ejecutar pruebas
- script: |
    echo "Instalando dependencias..."
    python -m venv .venv
    .venv/bin/python -m pip install --upgrade pip
    .venv/bin/pip install -r requirements.txt

    echo "Exportando variables de entorno..."
    export DATABASE_URL=$DATABASE_URL
    export DATABASE_URL_ADMIN=$DATABASE_URL_ADMIN
    export DATABASE_URL_ADMIN=$DATABASE_URL_PUBLICO
    export DJANGO_SETTINGS_MODULE=fichas_backend.settings

    echo "Ejecutando pruebas con pytest..."
    .venv/bin/python -m pytest -v
  displayName: 'Instalar dependencias y ejecutar pruebas'


# Push a GitHub solo si las pruebas pasan
- script: |
    echo "Configurando GitHub remoto..."
    git remote remove origin-gh || true
    git remote add origin-gh https://Zarael25:$(GITHUB_TOKEN)@github.com/Zarael25/Backend.git
    git checkout develop
    git push origin-gh develop
  displayName: 'Push Azure develop to GitHub'